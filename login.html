<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Log in · PARALLAX</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%274%27 y=%274%27 width=%2724%27 height=%2724%27 rx=%277%27 fill=%27%23FF5FA2%27 stroke=%27%232B2350%27 stroke-width=%273%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<header id="site-header" class="site-header"></header>
<main id="app" class="container is-loading">
  <div class="toy-wrap"><div class="toy-slot" aria-hidden="true"></div><p class="toy-hint">Psst! Drag me around, Shift + drag to spin.</p></div>
  <section class="card auth-card">
    <h1>Log in</h1>
    <form id="login-form" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <div id="msg" class="msg" role="alert" hidden></div>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
    <p class="auth-links"><a href="reset-request.html">Forgot your password?</a><br><a href="signup.html">Create an account</a></p>
  </section>
</main>
<noscript><p class="msg msg-error container">PARALLAX needs JavaScript enabled.</p></noscript>
<script type="module" src="js/pages/login.js"></script>
</body>
</html>
