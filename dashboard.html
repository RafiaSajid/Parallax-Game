<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Dashboard · PARALLAX</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%274%27 y=%274%27 width=%2724%27 height=%2724%27 rx=%277%27 fill=%27%23FF5FA2%27 stroke=%27%232B2350%27 stroke-width=%273%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header" class="site-header"></header>
<main id="app" class="container is-loading">
  <div id="head-msg" class="msg" role="alert" hidden></div>
  <section class="page-head">
    <div><p class="muted">Dashboard</p><h1 id="welcome">Welcome</h1></div>
    <div class="row"><a id="play" class="btn btn-primary btn-lg" href="levels.html">Play</a><button id="logout-btn" class="btn btn-ghost" type="button">Log out</button></div>
  </section>
  <section id="stats" class="grid grid-4" aria-label="Summary"></section>
  <section class="section"><h2>Rooms</h2><div id="progress" class="grid grid-2"></div></section>
  <section class="section"><h2>Recent runs</h2><div id="results"></div></section>
  <section class="section"><h2>Achievements</h2><div id="achievements" class="grid grid-3"></div></section>
  <section class="section"><h2>Settings</h2><div id="settings-card" class="card"></div></section>
</main>
<noscript><p class="msg msg-error container">PARALLAX needs JavaScript enabled.</p></noscript>
<script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
