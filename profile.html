<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Profile · PARALLAX</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%274%27 y=%274%27 width=%2724%27 height=%2724%27 rx=%277%27 fill=%27%23FF5FA2%27 stroke=%27%232B2350%27 stroke-width=%273%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<header id="site-header" class="site-header"></header>
<main id="app" class="container is-loading">
  <section class="page-head"><div><p class="muted">Profile</p><h1 id="name">Your profile</h1></div><button id="logout" class="btn btn-ghost" type="button">Log out</button></section>
  <div class="grid grid-2">
    <section class="card stack">
      <h2>Account</h2>
      <ul class="facts"><li>Email <b id="email"></b></li><li>Member since <b id="since"></b></li></ul>
      <form id="name-form" novalidate>
        <div class="field"><label for="display-name">Display name</label><input id="display-name" name="displayName" type="text" maxlength="64" required></div>
        <div id="name-msg" class="msg" role="status" hidden></div>
        <button class="btn btn-primary" type="submit">Save name</button>
      </form>
      <p class="hint">To change your password, use <a href="reset-request.html">password reset</a>.</p>
    </section>
    <section class="card">
      <h2>Settings</h2>
      <div id="settings-card"></div>
    </section>
  </div>
</main>
<noscript><p class="msg msg-error container">PARALLAX needs JavaScript enabled.</p></noscript>
<script type="module" src="js/pages/profile.js"></script>
</body>
</html>
